# Builds the iPhone app in the cloud and sends it to TestFlight.
#
# Signing uses an App Store Connect API key kept in Codemagic's encrypted
# environment variables, so no Codemagic team or manual certificates are
# needed: Codemagic creates the distribution certificate and profile itself.
#
# Set up once:
#   1. In App Store Connect, create the app with bundle ID
#      com.danaadylova.purlnote, and an API key (Users and Access ›
#      Integrations › App Store Connect API, access "App Manager").
#   2. On your Mac, make a private key for the signing certificate:
#        ssh-keygen -t rsa -b 2048 -m PEM -f ~/Desktop/ios_distribution_private_key -q -N ""
#   3. In Codemagic › this app › Environment variables, add these to a group
#      named "app_store", all marked Secret:
#        APP_STORE_CONNECT_ISSUER_ID       Issuer ID from step 1
#        APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID from step 1
#        APP_STORE_CONNECT_PRIVATE_KEY     the whole .p8 file's text
#        CERTIFICATE_PRIVATE_KEY           the whole text of the file from step 2
#      and to a group named "ravelry":
#        RAVELRY_CLIENT_ID                 the Ravelry app's client ID (not secret)
#        APP_STORE_APPLE_ID                the app's Apple ID number (App Information page)

workflows:
  ios-testflight:
    name: iOS to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
      xcode: latest
      groups:
        - app_store
        - ravelry
      vars:
        BUNDLE_ID: com.danaadylova.purlnote
    triggers:
      # Only build when asked, so the free build minutes last.
      events: []
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Check
        script: |
          flutter analyze
          flutter test
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build
        script: |
          # Each build gets the next number after the latest one on TestFlight.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --dart-define=RAVELRY_CLIENT_ID="$RAVELRY_CLIENT_ID" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

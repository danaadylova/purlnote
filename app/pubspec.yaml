name: purlnote
description: A phone notebook for your Ravelry projects, stash and patterns.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Talking to Ravelry and the sign-in function.
  http: ^1.2.2
  # Ravelry's sign-in page in the system's secure browser sheet.
  flutter_web_auth_2: ^4.1.0
  # Tokens live in the iOS Keychain / Android Keystore.
  flutter_secure_storage: ^11.2.0
  # The local database every screen reads from.
  sqflite: ^2.4.1
  path: ^1.9.0
  # Where downloaded and imported PDFs are kept.
  path_provider: ^2.1.5
  # The fingerprint (SHA-256) that ties notes to a PDF.
  crypto: ^3.0.6
  # Draws PDF pages, and reads their text for step-by-step.
  pdfrx: ^2.11.0
  # Importing a PDF from Files.
  file_picker: ^13.3.2
  # Keeps the screen on while reading.
  wakelock_plus: ^1.3.2
  # Taking or choosing project photos.
  image_picker: ^1.1.2
  # Opens Ravelry pages in the browser.
  url_launcher: ^6.3.1
  # The app's version, filled into feedback emails.
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Runs the same SQLite database in tests on a plain computer.
  sqflite_common_ffi: ^2.3.4
  # Lets tests move time forward, for the screen-awake timer.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/hello.jpg

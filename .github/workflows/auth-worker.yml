name: auth-worker

on:
  push:
    branches: [main]
    paths: ["auth-worker/**", ".github/workflows/auth-worker.yml"]
  pull_request:
    paths: ["auth-worker/**", ".github/workflows/auth-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: auth-worker/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RAVELRY_CLIENT_ID" ] && [ -n "$RAVELRY_CLIENT_SECRET" ]; then
            echo "ravelry=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploying without Ravelry credentials; sign-in stays off until RAVELRY_CLIENT_ID and RAVELRY_CLIENT_SECRET are added."
            echo "ravelry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (without Ravelry credentials yet)
        if: steps.check.outputs.cloudflare == 'true' && steps.check.outputs.ravelry != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: auth-worker
          command: deploy

      - name: Deploy with Ravelry credentials
        if: steps.check.outputs.cloudflare == 'true' && steps.check.outputs.ravelry == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: auth-worker
          command: deploy
          secrets: |
            RAVELRY_CLIENT_ID
            RAVELRY_CLIENT_SECRET
        env:
          RAVELRY_CLIENT_ID: ${{ secrets.RAVELRY_CLIENT_ID }}
          RAVELRY_CLIENT_SECRET: ${{ secrets.RAVELRY_CLIENT_SECRET }}

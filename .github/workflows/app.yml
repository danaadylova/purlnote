name: app

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      create_platform_folders:
        description: "Generate the ios/ and android/ folders and attach them to the run"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get

      - name: Formatting
        run: |
          dart format .
          if ! git diff --quiet -- .; then
            echo "::warning::Some files are not formatted. The diff below shows the fix."
            git diff -- .
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  platform-folders:
    if: github.event_name == 'workflow_dispatch' && inputs.create_platform_folders
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: app
        run: flutter create --org com.danaadylova --project-name purlnote --platforms=ios,android .
      # Pushed to a temporary branch so the folders can be reviewed and copied
      # onto main by hand. Only ios/, android/ and .metadata are kept; files
      # flutter create adds elsewhere (such as a sample test) are dropped.
      - name: Push to the platform-folders branch
        run: |
          git config user.name "Dana Adylova"
          git config user.email "danaadylova@gmail.com"
          git checkout -b platform-folders
          git add app/ios app/android app/.metadata
          git commit -m "Generated iOS and Android project folders"
          git push --force origin platform-folders
